# Mooring configuration. Copy to /etc/mooring/config.yaml (owned root:mooring,
# mode 0640) and fill in the generated values. See `docs/installation.md`.
#
#   mooring gen-key        -> encryption_key
#   mooring hash-password  -> auth.password_hash
#   mooring gen-totp       -> auth.totp_secret (optional 2FA)

bind_addr: "127.0.0.1:9000"          # the dashboard binds loopback; the edge fronts it

encryption_key: "<from gen-key>"

ip_allowlist:                         # who may reach the dashboard
  - "127.0.0.1/32"                    # the SSH tunnel arrives from loopback: keep these two
  - "::1/128"
  # - "203.0.113.10/32"               # your IP / VPN, only with admin.hostname below

auth:
  username: "operator"
  password_hash: "<from hash-password>"
  # totp_secret: "<from gen-totp>"

edge:
  mode: "managed"                     # Mooring runs the web server + HTTPS for you
  acme_email: "you@example.com"
  acme_ca: "https://acme-v02.api.letsencrypt.org/directory"   # required in managed mode
  # Optional: own a managed L4 (TCP/UDP) load balancer for non-HTTP stream services
  # (DNS 53, DoT 853, MQTTS 8883) so they can run as an auto-scaled internal replica
  # pool. Requires nginx and its stream module on the host (sudo mooring setup --l4 --yes).
  # Off by default.
  # l4_enabled: true
  # l4_nginx_digest: ""               # optional SHA-256 pin of the nginx binary

# admin:
#   hostname: "admin.example.com"     # Mooring serves the dashboard here over HTTPS, behind
#                                     # ip_allowlist (add your IP above). Omit to use an SSH tunnel.

data_dir: "/var/lib/mooring"

# The Server tab watches for updates and scans your apps and this server for known
# vulnerabilities. All are ON by default — uncomment to turn one off. See docs/server-tab.md.
# server:
#   version_check_enabled: false      # stop checking GitHub for Mooring updates + advisories
#   image_scan_enabled: false         # stop the Trivy scan of your apps' images (it's a bit heavy)
#   host_scan_enabled: false          # stop the Trivy scan of this server's packages and binaries

# Security logs collect app output, the edge's access log, Mooring's audit events and the
# host's sshd/sudo/su/Fail2Ban logs, with secrets and personal data removed. ON by default:
# 14 days are kept on this server; set archive.s3 to also keep an encrypted copy off it.
# Shown with the defaults. See docs/security-logs.md.
# security_logs:
#   enabled: true                     # false turns collection off
#   hot_retention: 14d                # kept and searchable on this server (1d–90d)
#   hot_max_disk_mb: 10240            # disk for the on-server copy (minimum 256)
#   archive:
#     retention: 365d                 # archived hours older than this are deleted (minimum 1d)
#     s3:                             # no default: without it nothing leaves this server
#       bucket: "my-security-logs"
#       endpoint: "s3.eu-west-1.amazonaws.com"
#       region: "eu-west-1"
#       access_key_id: "<access key id>"
#       secret_access_key: "<secret access key>"
#       prefix: "mooring/"            # optional; letters, digits, / - _ . and a trailing /
#       path_style: true
#       insecure: false               # true allows plain http:// (a private MinIO)
#   pii:
#     hash_fields: []                 # more field names stored as a keyed hash
#     drop_fields: []                 # more field names removed
#     keep_fields: []                 # names taken out of the built-in lists
#   host_logs:
#     enabled: true                   # false: no host logs
#     auth_log: ""                    # "" = /var/log/auth.log, else /var/log/secure
#     fail2ban_log: ""                # "" = /var/log/fail2ban.log
#     journal:                        # unset = the journal only when there is no auth log file
#   detection:
#     enabled: true                   # false: events are collected but not checked
#     patterns:
#       enabled: true                 # false: log lines are not grouped into patterns
#       max_cpu_percent: 5            # the pattern miner's share of one CPU core (1–25)
#       exclude_apps: []              # app slugs whose log lines are not mined
#   response:
#     mode: "off"                     # "recommend": record what would be done; "enforce": do it
#     max_blocks_per_hour: 60         # automatic blocks an hour (1–1000)
#     max_revokes_per_hour: 3         # automatic sign-outs an hour (1–100)
#     max_block_duration: 24h         # the longest automatic block a repeat reaches (1h–7d)
#   blocking:
#     max_entries: 1000               # active automatic blocks (1–10000)
#     manual_max_duration: 30d        # the longest manual block (1h–30d)
#     l4: false                       # true: L4 forward: proxy listeners refuse blocked IPv4 addresses
#     never_block: []                 # addresses and CIDRs never blocked
