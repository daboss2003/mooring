# Reference systemd drop-in: let Mooring's supervised edge/L4 children bind
# privileged ports (< 1024).
#
# Mooring supervises its edge (Caddy, ports 80/443) and — when edge.l4_enabled —
# its L4 load balancer (nginx-stream, e.g. DNS 53 / DoT 853) as CHILD processes, so
# they inherit the unit's capabilities. The shipped mooring.service already sets both
# directives below, so a current install does not need this file. Install it only if
# a local override of the unit removed them (it replaces only these two directives):
#   sudo install -D -m0644 mooring-privileged-ports.conf \
#     /etc/systemd/system/mooring.service.d/10-privileged-ports.conf
#   sudo systemctl daemon-reload && sudo systemctl restart mooring
#
# The bounding set is narrowed to EXACTLY this one capability (no others can be
# gained — NoNewPrivileges stays on). Inbound ports (80/443, 53/853, …) are opened in
# your HOST firewall, not here.
[Service]
CapabilityBoundingSet=CAP_NET_BIND_SERVICE
AmbientCapabilities=CAP_NET_BIND_SERVICE
