# Installed by the mooring package as /etc/needrestart/conf.d/mooring.conf. Perl syntax.
#
# needrestart does not restart mooring.service. A package upgrade restarts it itself, after the
# new version has checked /etc/mooring/config.yaml (the package's postinstall script); when the
# file is refused the running service is left on the previous version. Mooring restarts its
# Caddy and nginx children itself when a package upgrade replaces their files.
#
# 0 leaves the unit out of automatic restarts and unselected in needrestart's dialog. It is
# still listed as needing a restart.
$nrconf{override_rc}{qr(^mooring\.service$)} = 0;
