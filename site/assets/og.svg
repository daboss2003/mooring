<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Mooring — self-hosted PaaS for Docker">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1024"/>
      <stop offset="1" stop-color="#141b3a"/>
    </linearGradient>
    <radialGradient id="glow" cx="82%" cy="6%" r="55%">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b93ff"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect x="90" y="112" width="112" height="112" rx="30" fill="url(#tile)"/>
  <g transform="translate(90,112) scale(2.333)" fill="none" stroke="#ffffff" stroke-width="3.1" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="24.5" cy="13.4" r="4.1"/>
    <path d="M24.5 17.5v11.6"/>
    <path d="M24.5 29.1c0 6-4.9 8.9-9.2 6.4-3.2-1.8-3.6-6.5-.1-8.4"/>
  </g>
  <text x="228" y="196" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="60" font-weight="700" fill="#ffffff">Mooring</text>
  <text x="92" y="330" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="52" font-weight="700" fill="#ffffff">A self-hosted PaaS for Docker.</text>
  <text x="92" y="405" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="34" fill="#c3c9ea">Deploy multi-service apps from one YAML — automatic HTTPS,</text>
  <text x="92" y="450" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="34" fill="#c3c9ea">monitoring, alerts, backups, self-healing. No Swarm or Kubernetes.</text>
  <text x="92" y="560" font-family="ui-monospace, Menlo, monospace" font-size="28" fill="#818cf8">github.com/daboss2003/mooring</text>
