# GoReleaser config — build the static binary for linux amd64/arm64, package it as a
# .deb and .rpm (binary + systemd unit + the socket-proxy reference compose), produce
# checksums, GPG-sign them, and cut a GitHub release on each `vX.Y.Z` tag.
#   local check:  goreleaser check
#   dry run:      goreleaser release --snapshot --clean
version: 2

project_name: mooring

before:
  hooks:
    - go mod tidy

builds:
  - id: mooring
    main: ./cmd/mooring
    binary: mooring
    env:
      - CGO_ENABLED=0 # pure-Go (modernc sqlite) → a fully static binary
    goos: [linux]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.Version={{ .Version }}

archives:
  - id: mooring
    ids: [mooring]
    formats: ["tar.gz"]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - NOTICE
      - README.md
      - docs/**/*
      - deploy/systemd/mooring.service
      - deploy/socket-proxy/docker-compose.yml

nfpms:
  - id: mooring
    ids: [mooring]
    package_name: mooring
    vendor: Samson Olawale Oluwafemi
    homepage: https://github.com/daboss2003/mooring
    maintainer: Samson Olawale Oluwafemi <samsonoluwafemi203@gmail.com>
    description: |-
      Security-first self-hosted ops dashboard. Run your apps on your own server
      with automatic HTTPS, monitoring, and safe deploys — managed from one dashboard.
    license: Apache-2.0
    formats: [deb, rpm]
    # The managed HTTPS edge supervises a child Caddy, but Caddy is NOT a Depends or
    # Recommends: the distro repos carry an old Caddy (Ubuntu ships 2.6.2, below the 2.11
    # the edge needs) and apt installs Recommends by default, so either would pull that
    # build in on `apt install mooring`. `mooring setup` adds Caddy's official apt repo and
    # installs (or upgrades to) Caddy's official release.
    # Intentional: Caddy stays a Suggests rather than being dropped. apt never installs a
    # Suggests by default, and APT::AutoRemove::SuggestsImportant (on by default) keeps
    # `apt autoremove` from removing a caddy that the older packages' `recommends: [caddy]`
    # installed as automatic — without it the edge would lose its Caddy at the next restart.
    # nginx (+ stream) is only for opt-in L4, so it's a Suggests too.
    suggests: [caddy, nginx, libnginx-mod-stream]
    # Install the binary at /usr/local/bin so the packaged and manual installs use the
    # same path the shipped systemd unit's ExecStart expects.
    bindir: /usr/local/bin
    contents:
      - src: deploy/systemd/mooring.service
        dst: /usr/lib/systemd/system/mooring.service
      # Reference drop-in (NOT auto-active): grants the supervised edge/L4 children
      # CAP_NET_BIND_SERVICE. Copy into mooring.service.d/ only if the host owns the
      # public edge and/or the L4 load balancer (see the file header).
      - src: deploy/systemd/mooring-privileged-ports.conf
        dst: /usr/share/mooring/systemd/mooring-privileged-ports.conf
      - src: deploy/socket-proxy/docker-compose.yml
        dst: /usr/share/mooring/socket-proxy/docker-compose.yml
      - src: deploy/nfpm/config.example.yaml
        dst: /usr/share/mooring/config.example.yaml
      # needrestart (default on Ubuntu Server) restarts services that run a replaced binary
      # after every apt run. postinstall leaves mooring.service on the old version when the
      # new one refuses config.yaml; this keeps needrestart from restarting it anyway. A
      # host without needrestart never reads the file.
      # Intentional: the only packaged file under /etc, and a conffile (config|noreplace) —
      # an operator's edit or removal survives upgrades, and it is removed on purge.
      - src: deploy/needrestart/mooring.conf
        dst: /etc/needrestart/conf.d/mooring.conf
        type: config|noreplace
        file_info:
          mode: 0644
          owner: root
          group: root
      - src: LICENSE
        dst: /usr/share/doc/mooring/LICENSE
      - src: NOTICE
        dst: /usr/share/doc/mooring/NOTICE
    scripts:
      postinstall: deploy/nfpm/postinstall.sh
      preremove: deploy/nfpm/preremove.sh

checksum:
  name_template: "checksums.txt"

# GPG-sign the checksums file so users can verify downloads + the APT repo trusts it.
signs:
  - id: checksums
    cmd: gpg
    artifacts: checksum
    args:
      - "--batch"
      - "--local-user"
      - "{{ .Env.GPG_FINGERPRINT }}"
      - "--output"
      - "${signature}"
      - "--detach-sign"
      - "${artifact}"

release:
  github:
    owner: daboss2003
    name: Mooring
  draft: false
  prerelease: auto

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
